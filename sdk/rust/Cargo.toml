[package]
name = "cog-sdk"
version = "0.2.0"
edition = "2021"
description = "Rust client SDK for the CanadaOpportunityGraph (COG) API — CEGS 1.0"
license = "Apache-2.0"
repository = "https://github.com/Hardonian/CEO-G-Canada-Economic-Opportunity-Graph"
keywords = ["canada", "economic-graph", "cegs", "infrastructure", "open-data"]
categories = ["api-bindings"]

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
# Used for integration tests against a live or mock server.
mockito = "1"
